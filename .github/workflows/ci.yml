name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel in-progress runs on the same ref so PR updates don't queue up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  CI: "true"

jobs:
  # -----------------------------------------------------------------------
  # 1) Code quality: Prettier formatting check across the whole monorepo.
  # -----------------------------------------------------------------------
  format-check:
    name: Format (Prettier)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            backend/package-lock.json
            contracts/package-lock.json

      - name: Install root deps (prettier + prettier-plugin-solidity)
        run: npm ci

      - name: Prettier --check
        run: npm run format:check

  # -----------------------------------------------------------------------
  # 2) Frontend: ESLint, TypeScript type-check, Next.js production build.
  # -----------------------------------------------------------------------
  frontend:
    name: Frontend (lint + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Type-check (tsc --noEmit)
        run: npm run typecheck

      - name: Build (next build)
        run: npm run build
        env:
          NEXT_PUBLIC_BACKEND_URL: http://localhost:5000
          NEXT_PUBLIC_MONINGO_CONTRACT_ADDRESS: "0x0000000000000000000000000000000000000000"

      - name: Upload Next.js build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/.next
          retention-days: 3

  # -----------------------------------------------------------------------
  # 3) Smart contracts: Hardhat compile + tests.
  # -----------------------------------------------------------------------
  contracts:
    name: Contracts (compile + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: contracts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts
        run: npm run compile

      - name: Run tests
        run: npm run test

  # -----------------------------------------------------------------------
  # 4) Backend: lint + (future) tests. Lint only for now; tests need a DB.
  # -----------------------------------------------------------------------
  backend:
    name: Backend (lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

  # -----------------------------------------------------------------------
  # 5) Docker build: ensure all three Dockerfiles build successfully.
  # -----------------------------------------------------------------------
  docker-build:
    name: Docker build (compose)
    runs-on: ubuntu-latest
    needs: [frontend, contracts, backend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: moningo-backend:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: moningo-frontend:ci
          load: true
          build-args: |
            NEXT_PUBLIC_BACKEND_URL=http://localhost:5000
            NEXT_PUBLIC_MONINGO_CONTRACT_ADDRESS=0x0000000000000000000000000000000000000000
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build contracts image
        uses: docker/build-push-action@v6
        with:
          context: ./contracts
          file: ./contracts/Dockerfile
          push: false
          tags: moningo-contracts:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -----------------------------------------------------------------------
  # 6) Security audit: npm audit across all workspaces (non-blocking advisory).
  # -----------------------------------------------------------------------
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Audit frontend
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high || true

      - name: Audit backend
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high || true

      - name: Audit contracts
        working-directory: contracts
        run: npm audit --omit=dev --audit-level=high || true
