name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel in-progress runs on the same ref so PR updates don't queue up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  CI: "true"

jobs:
  # ---------------------------------------------------------------------------
  # 1) Code style: Prettier (incl. Solidity) across the monorepo.
  # ---------------------------------------------------------------------------
  format-check:
    name: Format (Prettier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: package-lock.json
      - name: Install root deps (prettier + prettier-plugin-solidity)
        run: npm ci
      - name: Prettier --check
        run: npm run format:check

  # ---------------------------------------------------------------------------
  # 2) Frontend: ESLint, TypeScript, Next.js production build.
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend (lint + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Lint (ESLint)
        run: npm run lint
      - name: Type-check (tsc --noEmit)
        run: npm run typecheck
      - name: Build (next build)
        run: npm run build
        env:
          NEXT_PUBLIC_BACKEND_URL: http://localhost:5001
          NEXT_PUBLIC_MONAD_RPC_URL: https://testnet-rpc.monad.xyz

  # ---------------------------------------------------------------------------
  # 3) Smart contracts: lint scripts/tests, compile, Hardhat test suite.
  # ---------------------------------------------------------------------------
  contracts:
    name: Contracts (lint + compile + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: contracts/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint (ESLint)
        run: npm run lint
      - name: Compile contracts
        run: npm run compile
      - name: Run tests
        run: npm run test

  # ---------------------------------------------------------------------------
  # 4) Backend: Prisma client, ESLint, unit + HTTP API tests (SQLite, chain offline).
  # ---------------------------------------------------------------------------
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Lint (ESLint)
        run: npm run lint
      - name: Tests (node:test)
        run: npm test

  # ---------------------------------------------------------------------------
  # 5) Docker: all three images build.
  # ---------------------------------------------------------------------------
  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [frontend, contracts, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: moningo-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: moningo-frontend:ci
          build-args: |
            NEXT_PUBLIC_BACKEND_URL=http://localhost:5001
            NEXT_PUBLIC_MONAD_RPC_URL=https://testnet-rpc.monad.xyz
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Build contracts (deployer) image
        uses: docker/build-push-action@v6
        with:
          context: ./contracts
          push: false
          tags: moningo-contracts:ci
          cache-from: type=gha,scope=contracts
          cache-to: type=gha,mode=max,scope=contracts

  # ---------------------------------------------------------------------------
  # 6) Dependency audit (advisory, never blocks).
  # ---------------------------------------------------------------------------
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Audit
        run: |
          for d in frontend backend contracts; do
            echo "::group::$d"; (cd "$d" && npm audit --omit=dev --audit-level=high) || true; echo "::endgroup::"
          done
