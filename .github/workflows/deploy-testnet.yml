name: Deploy to Monad Testnet

# Manual workflow: compiles & deploys the Moningo contract to Monad Testnet,
# funds the verifier, and uploads the contract address as an artifact.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'deploy' to confirm deployment to Monad Testnet"
        required: true
        default: ""

jobs:
  deploy:
    name: Deploy Moningo contract
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirm == 'deploy' }}
    defaults:
      run:
        working-directory: contracts
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: contracts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts
        run: npm run compile

      - name: Verify secrets present
        run: |
          if [ -z "${{ secrets.MONAD_DEPLOYER_PRIVATE_KEY }}" ]; then
            echo "::error::MONAD_DEPLOYER_PRIVATE_KEY secret is missing"
            exit 1
          fi
          if [ -z "${{ secrets.MONAD_VERIFIER_PRIVATE_KEY }}" ]; then
            echo "::error::MONAD_VERIFIER_PRIVATE_KEY secret is missing"
            exit 1
          fi

      - name: Deploy contract
        run: npm run deploy:testnet
        env:
          PRIVATE_KEY: ${{ secrets.MONAD_DEPLOYER_PRIVATE_KEY }}
          MONAD_RPC_URL: ${{ secrets.MONAD_RPC_URL }}

      - name: Fund verifier
        run: npm run fund:testnet
        env:
          PRIVATE_KEY: ${{ secrets.MONAD_DEPLOYER_PRIVATE_KEY }}
          MONAD_RPC_URL: ${{ secrets.MONAD_RPC_URL }}

      - name: Read deployed address
        id: addr
        run: |
          ADDR=$(cat .moningo-address 2>/dev/null || echo "")
          echo "address=$ADDR" >> "$GITHUB_OUTPUT"
          echo "Deployed contract address: $ADDR"

      - name: Upload address artifact
        uses: actions/upload-artifact@v4
        with:
          name: moningo-contract-address
          path: contracts/.moningo-address
          if-no-files-found: ignore
          retention-days: 90
