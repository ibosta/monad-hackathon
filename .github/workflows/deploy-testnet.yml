name: Deploy to Monad Testnet

# Manual: tests, then deploys the selected contracts to Monad Testnet and uploads the
# generated address/ABI files (backend/src/contract/*.json) as an artifact.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "What to deploy"
        type: choice
        options: [games, streak, badges, moningo, all]
        default: games
      confirm:
        description: "Type 'deploy' to confirm"
        required: true
        default: ""

jobs:
  deploy:
    name: Deploy (${{ github.event.inputs.target }})
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirm == 'deploy' }}
    environment: monad-testnet
    defaults:
      run:
        working-directory: contracts
    env:
      PRIVATE_KEY: ${{ secrets.MONAD_DEPLOYER_PRIVATE_KEY }}
      VERIFIER_ADDRESS: ${{ secrets.MONAD_VERIFIER_ADDRESS }}
      MONAD_RPC_URL: ${{ secrets.MONAD_RPC_URL || 'https://testnet-rpc.monad.xyz' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: contracts/package-lock.json
      - run: npm ci
      - name: Check secrets
        run: |
          if [ -z "$PRIVATE_KEY" ]; then echo "::error::MONAD_DEPLOYER_PRIVATE_KEY secret is missing"; exit 1; fi
      - name: Test before deploying
        run: npm test
      - name: Deploy Moningo (daily + exam + certificates)
        if: ${{ contains(fromJSON('["moningo","all"]'), github.event.inputs.target) }}
        run: npm run deploy:testnet
      - name: Deploy duel + practice
        if: ${{ contains(fromJSON('["games","all"]'), github.event.inputs.target) }}
        run: npm run deploy:games
      - name: Deploy streak tree
        if: ${{ contains(fromJSON('["streak","all"]'), github.event.inputs.target) }}
        run: npm run deploy:streak
      - name: Deploy badges
        if: ${{ contains(fromJSON('["badges","all"]'), github.event.inputs.target) }}
        run: npm run deploy:badges
      - name: Upload deployment files
        uses: actions/upload-artifact@v4
        with:
          name: moningo-deployments
          path: backend/src/contract/*.json
          retention-days: 90
